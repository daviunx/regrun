name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# Workflow-level floor. Without this block the called `test` workflow would
# inherit the REPOSITORY default (Settings -> Actions -> Workflow permissions),
# which is not visible in this file and may still be the legacy read/write.
permissions:
  contents: read

jobs:
  # The release gate. A tag push does not trigger test.yml on its own (that
  # fires on push-to-main / pull_request), so without this the tag pipeline
  # would publish code no job had ever tested.
  #
  # This deliberately deviates from the fleet convention in
  # documentation/standards/infrastructure/library-publishing.md:177 ("tag
  # pipelines are not re-linted"). That convention is safe on GitLab only
  # because the branch pipeline already tested the SHA. regrun publishes to
  # PUBLIC PyPI, where a bad cut is irreversible -- a version can be yanked but
  # never reused -- and its release is the fleet's regression-gate binary. The
  # `needs: [test]` shape already exists in that same standard's TypeScript
  # path (L271, L283-284). Do not "correct" this back to an ungated release.
  test:
    name: Test gate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Build is deliberately SEPARATE from publish and holds NO `id-token`.
  # `python -m build` downloads the build backend (poetry-core, unpinned and
  # unhashed) from PyPI and executes it. Running that in the same job as the
  # OIDC mint would put arbitrary third-party build code in the same process as
  # the credential that can publish to pypi.org/project/regrun. This is PyPA's
  # own recommended shape: build here, hand over a dist artifact, publish there.
  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/regrun/
    # A job-level `permissions:` block REPLACES the default set -- every scope
    # not listed becomes `none`. `contents: read` is therefore required, not
    # optional: `download-artifact` and the publish action need it, and without
    # it the release pipeline goes red. `id-token: write` (the OIDC mint for
    # PyPI trusted publishing) is scoped to this job alone.
    #
    # NOTE: no `actions/checkout` here. This job never touches repo source --
    # it only downloads the already-built dist and uploads it. Less code in the
    # job holding the mint is the entire point.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
