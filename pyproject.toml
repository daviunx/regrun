[project]
name = "regrun"
version = "0.8.3"
description = "YAML-driven regression test runner for HTTP APIs, MCP servers, and shell commands"
authors = [{name = "David Marsa", email = "david.marsa@neomanex.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.28",
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.0",
    "jsonpath-ng>=1.6",
    "websockets>=13.0",
    "fastmcp (>=3.4.2,<4.0.0)",
]

[project.urls]
Homepage = "https://github.com/daviunx/regrun"
Repository = "https://github.com/daviunx/regrun"
Issues = "https://github.com/daviunx/regrun/issues"

[project.scripts]
regrun = "regrun.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "mypy (>=1.13,<3.0)",
    "types-PyYAML (>=6.0,<7.0)"
]

[tool.mypy]
# Tracks the package's MINIMUM supported runtime (requires-python = ">=3.11"),
# not the fleet template's 3.12 — pinning 3.12 here would silently green-light
# 3.12-only constructs in a package that promises to run on 3.11.
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
# DEVIATION from documentation/standards/python/03-tooling.md (`strict = true`).
# Default strictness is clean (0 errors); --strict reports 69, ~50 of them
# mechanical [type-arg] bare generics. Landing blocking-at-default now beats an
# advisory strict job nobody actions. Ratchet to strict: task 5500a359.
strict = false

# Genuine third-party packages shipping no py.typed and having no stubs on
# PyPI. NEVER add first-party `regrun.*` here -- that degrades the whole package
# to Any and mypy passes while checking nothing
# (documentation/standards/python/03-tooling.md, incident 2026-07-17).
# PyYAML is NOT listed: real stubs exist and are installed via types-PyYAML.
[[tool.mypy.overrides]]
module = ["jsonpath_ng.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: slow tests",
    "integration: integration tests",
]

[tool.coverage.run]
source = ["regrun"]
branch = true
# ["greenlet", "thread"] per the standard would ConfigError — greenlet is not a
# dependency of this package. Thread alone covers the asyncio.run / subprocess
# paths in the runners.
concurrency = ["thread"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
# Measured floor per testing/overview.md § Coverage Enforcement (ratchet: only
# goes UP, rounded down to nearest 5). Raising toward the 80 target: task ac0e9586.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
